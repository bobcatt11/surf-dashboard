<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- Makes the page fit phone screens instead of showing a zoomed-out desktop view -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Surf Dashboard</title>
    <!-- Two free Google Fonts: chunky "Bowlby One" for headings,
         hand-drawn "Permanent Marker" for the scrawled bits -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Permanent+Marker&display=swap">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Page title, with a skate-shoe checkerboard strip underneath -->
    <header class="page-header">
      <h1>Surf Dashboard</h1>
      <p class="spot-name">Old Man's (Tourmaline), San Diego</p>
      <div class="checkerboard"></div>
    </header>

    <!-- Conditions right now -->
    <section class="right-now">
      <h2 class="section-title">Right Now</h2>
      <p id="waves">Loading waves...</p>
      <p id="wind">Loading wind...</p>
    </section>

    <h2 class="section-title">5-Day Forecast</h2>
    <div id="forecast">Loading 5-day forecast...</div>

    <!-- Surf spots near you (filled in by script.js) -->
    <section class="surf-spots">
      <h2 class="section-title">Surf Spots Near You</h2>
      <!-- Controls: a location button and a radius box -->
      <div class="spot-controls">
        <button id="use-my-location" type="button">Use my location</button>
        <label for="radius">Within
          <input id="radius" type="number" min="1" max="200" value="30"> miles
        </label>
      </div>
      <p id="location-status"></p>
      <ul id="spot-list"></ul>
    </section>

    <!-- All the page's JavaScript lives in script.js -->
    <script src="script.js"></script>
  </body>
</html>
